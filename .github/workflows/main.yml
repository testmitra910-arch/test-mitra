name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build TEST MITRA Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout GitHub repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Find and extract uploaded TEST MITRA ZIP
      # --------------------------------------------------
      - name: Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for uploaded ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/android-project"
          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/android-project"

          echo "ZIP extracted successfully."

          echo "Searching for Gradle wrapper..."

          GRADLEW_FILE=$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW_FILE" ]; then
            echo "ERROR: gradlew was not found inside the uploaded ZIP."
            echo ""
            echo "Files found in extracted project:"
            find "$GITHUB_WORKSPACE/android-project" \
              -maxdepth 5 \
              -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_FILE")

          echo "Gradle wrapper found:"
          echo "$GRADLEW_FILE"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "WARNING: app directory not found directly in PROJECT_DIR."
            echo "Checking project structure..."
            find "$PROJECT_DIR" -maxdepth 2 -type d
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. Setup Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 4. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Configure Supabase
      # --------------------------------------------------
      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -e

          echo "Configuring Supabase..."

          cd "$PROJECT_DIR"

          if [ -z "$SUPABASE_URL" ]; then
            echo "WARNING: SUPABASE_URL GitHub Secret is not configured."
          else
            echo "SUPABASE_URL is available."
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "WARNING: SUPABASE_ANON_KEY GitHub Secret is not configured."
          else
            echo "SUPABASE_ANON_KEY is available."
          fi

          # Create local.properties only if the project uses it.
          # Values are NOT printed to logs.
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            {
              echo "SUPABASE_URL=$SUPABASE_URL"
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            } > local.properties
          fi

          echo "Supabase configuration step completed."

      # --------------------------------------------------
      # 6. Make Gradle executable
      # --------------------------------------------------
      - name: Make Gradle executable
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found:"
            echo "$PROJECT_DIR/gradlew"
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle wrapper is executable."

      # --------------------------------------------------
      # 7. Check project
      # --------------------------------------------------
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # --------------------------------------------------
      # 8. Clean build
      # --------------------------------------------------
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -e

          ./gradlew clean --stacktrace

      # --------------------------------------------------
      # 9. Build DEBUG APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -e

          echo "Starting TEST MITRA APK build..."

          ./gradlew assembleDebug --stacktrace --no-daemon

          echo "APK build command completed successfully."

      # --------------------------------------------------
      # 10. Find generated APK
      # --------------------------------------------------
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."

      # --------------------------------------------------
      # 11. Upload APK as GitHub Artifact
      # --------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 12. Final success message
      # --------------------------------------------------
      - name: Build completed
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       TEST MITRA APK BUILD SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "APK has been uploaded to GitHub Actions."
          echo "Open the Artifacts section and download:"
          echo "TEST-MITRA-APK"
          echo ""
