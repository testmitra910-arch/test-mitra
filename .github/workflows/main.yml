name: Build TEST MITRA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TEST MITRA Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Find uploaded ZIP
      - name: Find TEST MITRA ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 6. Extract ZIP automatically
      - name: Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted_project

          echo "ZIP extracted successfully."

          echo "Extracted files:"
          find extracted_project -maxdepth 3 -type f | head -100

      # 7. Locate Android project
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "Searching for build.gradle files..."
            find "$GITHUB_WORKSPACE/extracted_project" \
              -name "build.gradle" \
              -o -name "build.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 8. Configure Supabase
      - name: Configure Supabase
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Configuring Supabase..."

          if [ -n "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL is configured."
          else
            echo "WARNING: SUPABASE_URL secret is not configured."
          fi

          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_ANON_KEY is configured."
          else
            echo "WARNING: SUPABASE_ANON_KEY secret is not configured."
          fi

      # 9. Setup Gradle 9.3.1
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 10. Check Gradle version
      - name: Check Gradle version
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle --version

      # 11. Verify Android project
      - name: Verify Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "App directory:"
          ls -la app || true

      # 12. Clean project
      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle clean --no-daemon

      # 13. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # 14. Find APK
      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      # 15. Upload APK
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error

      # 16. Build completed
      - name: Build completed
        run: |
          echo "======================================"
          echo "TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"
