name: Build TEST MITRA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build TEST MITRA Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout GitHub repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Java
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Setup Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 4. Install required Android SDK packages
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ---------------------------------------------------------
      # 5. Find and extract uploaded ZIP
      # ---------------------------------------------------------
      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -o "$ZIP_FILE" -d extracted_project

          echo "ZIP extracted successfully."

          echo "Extracted files:"
          find extracted_project -maxdepth 4 -type f | head -200

      # ---------------------------------------------------------
      # 6. Automatically locate actual Android project
      # ---------------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          # First preference: Gradle wrapper
          GRADLEW=$(find extracted_project \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          # Second preference: settings.gradle / settings.gradle.kts
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_FILE=$(find extracted_project \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo ""
            echo "Available project files:"
            find extracted_project -type f | head -300
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 7. Configure Supabase
      # ---------------------------------------------------------
      - name: Configure Supabase
        shell: bash
        run: |
          set -e

          echo "Configuring Supabase..."

          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL is available."
          else
            echo "WARNING: SUPABASE_URL secret is not configured."
          fi

          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_ANON_KEY is available."
          else
            echo "WARNING: SUPABASE_ANON_KEY secret is not configured."
          fi

          # Create local.properties if the project needs it
          cat > "$PROJECT_DIR/local.properties" <<EOF
          sdk.dir=$ANDROID_HOME
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

          echo "Supabase configuration completed."

      # ---------------------------------------------------------
      # 8. Make Gradle executable
      # ---------------------------------------------------------
      - name: Make Gradle executable
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            echo "Current directory:"
            pwd
            echo "Files:"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper is ready."

      # ---------------------------------------------------------
      # 9. Verify Android project
      # ---------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ---------------------------------------------------------
      # 10. Clean project
      # ---------------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean --no-daemon

      # ---------------------------------------------------------
      # 11. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting APK build..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 12. Find generated APK
      # ---------------------------------------------------------
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build directory:"
            find "$PROJECT_DIR" -maxdepth 6 -type f | grep -E "\.(apk|aab)$" || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TEST-MITRA.apk"

          echo "APK_PATH=$GITHUB_WORKSPACE/apk-output/TEST-MITRA.apk" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 13. Upload APK
      # ---------------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk-output/TEST-MITRA.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 14. Build completed
      # ---------------------------------------------------------
      - name: Build completed
        shell: bash
        run: |
          echo "======================================"
          echo "TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "APK:"
          echo "$APK_PATH"
