name: Build TEST MITRA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TEST MITRA Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Find ZIP
      - name: Find TEST MITRA ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 6. Extract ZIP
      - name: Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted_project

          echo "ZIP extracted successfully."

      # 7. Locate Android project
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted_project" \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 8. Configure Supabase
      - name: Configure Supabase
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Configuring Supabase..."

          if [ -n "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL configured."
          else
            echo "WARNING: SUPABASE_URL not configured."
          fi

          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_ANON_KEY configured."
          else
            echo "WARNING: SUPABASE_ANON_KEY not configured."
          fi

      # 9. Setup Gradle 9.3.1
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 10. Create missing debug.keystore
      - name: Create debug.keystore
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Checking debug.keystore..."

          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not found."
            echo "Creating debug.keystore..."

            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."
          else
            echo "debug.keystore already exists."
          fi

          ls -lh debug.keystore

      # 11. Check Gradle
      - name: Check Gradle version
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle --version

      # 12. Verify project
      - name: Verify Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Project:"
          pwd

          echo "Files:"
          ls -la

          echo "App:"
          ls -la app || true

      # 13. Clean
      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle clean --no-daemon

      # 14. Build APK
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # 15. Find APK
      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      # 16. Upload APK
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error

      # 17. Done
      - name: Build completed
        run: |
          echo "======================================"
          echo "TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"
